info:
  name: search-movies
  type: http
  seq: 1

http:
  method: GET
  url: "{{tmdb_base_url}}/search/movie?query={{?Query}}&language={{language}}&include_adult={{include_adult}}"
  params:
    - name: query
      value: "{{?Query}}"
      type: query
    - name: language
      value: "{{language}}"
      type: query
    - name: include_adult
      value: "{{include_adult}}"
      type: query
    - name: primary_release_year
      value: "{{?Year}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
