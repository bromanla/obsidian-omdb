info:
  name: tv-details
  type: http
  seq: 4

http:
  method: GET
  url: "{{tmdb_base_url}}/tv/{{?ID}}?language={{language}}&append_to_response=translations,external_ids"
  params:
    - name: language
      value: "{{language}}"
      type: query
    - name: append_to_response
      value: translations,external_ids
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
