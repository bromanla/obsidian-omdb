info:
  name: search-tv
  type: http
  seq: 3

http:
  method: GET
  url: "{{tmdb_base_url}}/search/tv?query={{?Query}}&language={{language}}&include_adult={{include_adult}}"
  params:
    - name: query
      value: "{{?Query}}"
      type: query
    - name: language
      value: "{{language}}"
      type: query
    - name: include_adult
      value: "{{include_adult}}"
      type: query
    - name: first_air_date_year
      value: "{{?Year}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
