info:
  name: search
  type: http
  seq: 1

http:
  method: GET
  url: "{{omdb_base_url}}/?s={{?Query}}&r=json"
  params:
    - name: s
      value: "{{?Query}}"
      type: query
    - name: r
      value: json
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
