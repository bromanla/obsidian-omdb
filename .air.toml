root = "."
tmp_dir = ".air/tmp"
env_files = [".env"]

[build]
  cmd = "go build -buildvcs=false -o ./.air/tmp/omdb-bot ./cmd"
  entrypoint = ["./.air/tmp/omdb-bot"]
  include_dir = ["cmd", "internal"]
  include_ext = ["go", "md"]
  include_file = ["go.mod", "go.sum"]
  stop_on_error = true

[misc]
  clean_on_exit = true
